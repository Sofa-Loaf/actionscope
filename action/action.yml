# Nested path kept for uses: Sofa-Loaf/actionscope/action@v0.1.0 and local ./action.
# Publish the Marketplace listing from the root action.yml (GitHub requires it).
name: 28to3-actionscope
description: >-
  See where your GitHub Actions minutes go. Estimate billable minutes by job
  and OS, then post a Job Summary for this run.
author: Sofa-Loaf
branding:
  icon: activity
  color: blue

inputs:
  github-token:
    description: Token used to read jobs for this workflow run. Defaults to the workflow GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}

outputs:
  estimated-minutes:
    description: Estimated quota-equivalent billable minutes for jobs visible in this run
  job-count:
    description: Number of jobs included in the estimate
  wall-seconds:
    description: Sum of observed wall-clock seconds across those jobs

runs:
  using: node24
  main: index.js
