name: Actionscope demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run estimate tests
        run: node action/estimate.test.js && node action/index.integration.test.js
      - name: Root action.yml is Marketplace-ready
        run: |
          test -f action.yml
          grep -q 'name: 28to3-actionscope' action.yml
          grep -q 'icon: activity' action.yml
          grep -q 'color: blue' action.yml
          grep -q 'using: node24' action.yml
          grep -q 'main: action/index.js' action.yml
          ! grep -n 'buy.stripe.com' README.md CONTRIBUTING.md docs/GO_TO_MARKET.md action.yml action/action.yml action/estimate.js action/index.js

  build:
    name: Fake build
    runs-on: ubuntu-latest
    steps:
      - name: Pretend to compile
        run: sleep 8

  test:
    name: Fake test
    runs-on: ubuntu-latest
    steps:
      - name: Pretend to test
        run: sleep 5

  estimate:
    name: Actionscope estimate
    needs: [unit, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estimate Actions minutes
        id: scope
        uses: ./
      - name: Nested path still works
        uses: ./action
      - name: Show outputs
        run: |
          echo "estimated-minutes=${{ steps.scope.outputs.estimated-minutes }}"
          echo "job-count=${{ steps.scope.outputs.job-count }}"
          echo "wall-seconds=${{ steps.scope.outputs.wall-seconds }}"
